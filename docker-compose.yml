name: 'laravel-multiple'
services:
    php:
        build:
            dockerfile: ./Dockerfile
        volumes:
            - ./sources:/var/www/sources
        dns:
            - 8.8.8.8
            - 4.4.4.4
        restart: always

    nginx:
        build: 
            context: ./nginx
            dockerfile: Dockerfile
            args:
                SSL_ON: "false"
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./sources:/app/sources:ro

    mariadb:
        image: 'mariadb:10.11.11'
        environment:
            - MARIADB_DATABASE=laravel
            - MARIADB_USER=laravel
            - MARIADB_PASSWORD=laravel
            - MARIADB_ROOT_PASSWORD=root
        privileged: true
        volumes:
            - ./.mariadb:/var/lib/mysql
        restart: always

    adminer:
        image: adminer:4.8.0
        environment:
            - ADMINER_DEFAULT_SERVER=mariadb
        ports:
            - 8888:8080
        restart: always

    redis:
        image: redis:7.0
        environment:
            - ALLOW_EMPTY_PASSWORD=yes
        ports:
            - :6379
        restart: always

    mailhog:
        image: mailhog/mailhog:latest
        ports:
            - :1025
            - :8025
        restart: always
