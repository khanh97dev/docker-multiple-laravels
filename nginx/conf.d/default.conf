
map $host $root_path {
    web1.com /var/www/sources/web1.com/public;
    web2.com /var/www/sources/web2.com/public;
}

# --- 2. HTTP Server Block (Port 80) ---
server {
    listen 80;
    # Use a wildcard server_name for flexibility
    server_name _; 

    root $root_path;
    index index.php index.html;

    # Optional: Redirect HTTP to HTTPS for all configured domains
    # return 301 https://$host$request_uri;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}

# --- 3. HTTPS Server Block (Port 443) ---
server {
    listen 443 ssl;
    # Use a wildcard server_name for flexibility
    server_name _;

    ssl_certificate /etc/nginx/ssl/$host.crt;
    ssl_certificate_key /etc/nginx/ssl/$host.key;

    # SSL Parameters (recommended security settings)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root $root_path;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}